<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>상식 퀴즈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="identity">학번 2601957 이름 양해인</header>

  <main class="container">
    <section id="screen-category" hidden>
      <h1>상식 퀴즈</h1>
      <p class="lead">카테고리를 고르세요</p>
      <div id="category-buttons" class="button-list"></div>
    </section>

    <section id="screen-mode" hidden>
      <h1 id="mode-heading"></h1>
      <div id="mode-buttons" class="button-list"></div>
      <button id="mode-back" class="link-button" type="button">뒤로</button>
    </section>

    <section id="screen-quiz" hidden>
      <div class="quiz-bar">
        <span id="quiz-context"></span>
        <span id="quiz-progress"></span>
        <span id="quiz-score"></span>
        <span id="quiz-timer" hidden></span>
      </div>
      <h2 id="quiz-question"></h2>
      <div id="quiz-choices" class="choice-list"></div>
      <button id="quiz-hint" class="hint-button" type="button" hidden>힌트 (오답 2개 지우기)</button>
      <div id="quiz-feedback" class="feedback" hidden></div>
      <button id="quiz-next" class="big-button next-button" type="button" hidden>다음</button>
    </section>
    <section id="screen-result" hidden>
      <h1 id="result-heading"></h1>
      <p id="result-score" class="result-score"></p>
      <p id="result-correct"></p>
      <p id="result-note" class="note" hidden>순위표에 기록되지 않음</p>
      <h2 class="result-subtitle">문항별 결과</h2>
      <ol id="result-list" class="result-list"></ol>
      <div class="button-list">
        <button id="result-retry" class="big-button" type="button" hidden>틀린 문제 다시 풀기</button>
        <button id="result-again" class="big-button" type="button">같은 모드 다시</button>
        <button id="result-home" class="big-button" type="button">다시 시작</button>
      </div>
    </section>
    <section id="screen-leaderboard" hidden></section>
  </main>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
